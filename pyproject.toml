[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyar-chem"
version = "1.1.1"
description = "PyAR: Python program for Aggregation and Reaction"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  {name = "Anakuthil Anoop", email = "anoop@chem.iitkgp.ac.in"},
]
keywords = [
  "computational chemistry",
  "global optimisation",
  "molecular aggregation",
  "reaction exploration",
  "scientific software",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.18.4",
  "autograd>=1.3",
  "scipy>=1.5.2",
  "networkx",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/anooplab/pyar"
Documentation = "https://pyar.readthedocs.io/"
Repository = "https://github.com/anooplab/pyar"
Issues = "https://github.com/anooplab/pyar/issues"

[project.scripts]
pyar-cli = "pyar.cli:main"
pyar-react = "pyar.scripts.react:main"
pyar-explore = "pyar.scripts.explore:main"
pyar-optimiser = "pyar.scripts.optimiser:main"
pyar-trial-generation = "pyar.scripts.trial_generation:main"
pyar-clustering = "pyar.scripts.clustering:main"
pyar-energy-table = "pyar.scripts.energy_table:main"
pyar-reaction-trace = "pyar.scripts.reaction_trace:main"
pyar-conformer = "pyar.scripts.conformer:main"
pyar-benchmark-clustering = "pyar.scripts.benchmark_clustering:main"
pyar-benchmark-orientations = "pyar.scripts.benchmark_orientations:main"
pyar-similarity = "pyar.scripts.similarity:main"
pyar-descriptor = "pyar.scripts.descriptor:main"
pyar-mlopt = "pyar.backends.mlopt:main"
pyar-aimnet2-ase-opt = "pyar.AIMNet2.calculators.aimnet2_ase_opt:main"

[project.optional-dependencies]
test = [
  "pytest",
  "build",
  "twine",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
]
selection = [
  "MDAnalysis",
  "ase",
  "dscribe",
  "hdbscan",
  "matplotlib",
  "pandas>=1.0.5",
  "scikit-learn>=0.23.2",
]
ml = [
  "h5py",
  "mlatom",
  "pandas>=1.0.5",
  "pyh5md",
  "torch",
  "torchani==2.0",
]
aimnet2 = [
  "ase",
  "torch",
]
xtb = [
  "ase",
  "geometric>=1.1",
]
openbabel = [
  "openbabel>=3.2.0",
]
conformer = [
  "rdkit",
]
all = [
  "ase",
  "build",
  "dscribe",
  "geometric>=1.1",
  "h5py",
  "hdbscan",
  "matplotlib",
  "MDAnalysis",
  "mlatom",
  "openbabel>=3.2.0",
  "pandas>=1.0.5",
  "pyh5md",
  "rdkit",
  "pytest",
  "scikit-learn>=0.23.2",
  "sphinx",
  "sphinx-rtd-theme",
  "torch",
  "torchani==2.0",
  "twine",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyar*"]

[tool.setuptools.package-data]
pyar = [
  "mlatom/LICENSE",
]

[tool.setuptools.exclude-package-data]
pyar = [
  "AIMNet2/models/*.jpt",
  "mlatom/MLatomF",
  "mlatom/cs.so",
  "mlatom/ref.json",
  "mlatom/aiqm1_model/*.pt",
]
