[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyar-chem"
version = "1.6.0"
description = "PyAR: Python program for Aggregation and Reaction"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
authors = [
  {name = "Anakuthil Anoop", email = "anoop@chem.iitkgp.ac.in"},
]
keywords = [
  "computational chemistry",
  "global optimisation",
  "molecular aggregation",
  "reaction exploration",
  "scientific software",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.18.4",
  "scipy>=1.5.2",
  "networkx",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/anooplab/pyar"
Documentation = "https://pyar.readthedocs.io/"
Repository = "https://github.com/anooplab/pyar"
Issues = "https://github.com/anooplab/pyar/issues"

[project.scripts]
pyar = "pyar.cli:main"

[project.optional-dependencies]
aggregate = ["ase", "dscribe", "hdbscan", "scikit-learn>=0.23.2"]
grow = ["pyar-chem[aggregate]"]
conformer = ["rdkit"]
reaction = ["pyar-chem[aggregate,geometric]"]
microsolvate = ["pyar-chem[aggregate]"]
solvate = ["pyar-chem[microsolvate]"]
neb = ["pyar-chem[geometric]"]
geometric = ["ase", "geometric>=1.1"]
aimnet2 = ["ase", "torch"]
sella = ["sella>=2.6.0"]
geodesic = ["geodesic-interpolate>=1.0.0"]
structure-comparison = ["irmsd>=0.1.0"]
identity = ["rdkit"]
analysis = ["ase", "MDAnalysis", "matplotlib", "pandas>=1.0.5"]
ml = ["mlatom", "torch", "torchani==2.0", "ase", "setuptools>=69,<81", "requests", "joblib"]
# Compatibility aliases: xTB itself is an external executable.
xtb = ["pyar-chem[geometric]"]
selection = ["pyar-chem[aggregate,analysis]"]
all = ["pyar-chem[aggregate,conformer,reaction,microsolvate,neb,aimnet2,sella,geodesic,structure-comparison,identity,analysis,ml]"]

[dependency-groups]
test = ["pytest", "pytest-cov", "rdkit", "autograd>=1.3", "radon==6.0.1"]
docs = ["sphinx", "sphinx-rtd-theme"]
release = ["build", "twine"]
quality = ["ruff==0.14.1"]
dev = [
  {include-group = "test"},
  {include-group = "docs"},
  {include-group = "release"},
  {include-group = "quality"},
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyar*"]

[tool.setuptools.exclude-package-data]
pyar = [
  "AIMNet2/models/*.jpt",
]

[tool.coverage.run]
branch = true
source = ["pyar"]
omit = [
  "pyar/AIMNet2/*",
  "pyar/mlatom/*",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
markers = [
  "unit: isolated logic or mocked boundary tests",
  "regression: guards for previously identified behavior and defects",
  "integration: composed workflows, subprocesses or optional Python integrations",
  "scientific: analytical invariant or numerical reference validation",
  "tier1: deterministic analytical or structural invariants for every pull request",
  "tier2: inexpensive real-backend validation on scheduled or release runners",
  "tier3: extended scientific validation for major releases or scientific changes",
  "external_backend: requires a real external chemistry executable",
  "slow: expensive tests excluded from the fast lane only",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
