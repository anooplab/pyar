name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Open Babel
        run: |
          sudo apt-get update
          sudo apt-get install --yes openbabel
          obabel -V

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[selection,xtb]" --group test

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest --cov=pyar --cov-report=term-missing --junitxml=reports/pytest.xml

      - name: Review test omissions
        run: python tools/check_test_outcomes.py reports/pytest.xml tests/expected_xfails.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python-version }}
          path: reports/

      - name: Smoke-test CLI entry points
        run: |
          pyar-cli --help
          pyar-react --help

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . --group docs

      - name: Build documentation
        run: python -m sphinx -E -b html -W --keep-going docs docs/_build/html

  geodesic:
    name: Geodesic interpolation (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install geodesic optional extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[xtb,geodesic]" --group test

      - name: Exercise geodesic NEB initialization with the optional extra
        run: python -m pytest tests/test_neb.py -q

      - name: Check NEB CLI help
        run: pyar-neb --help

  sella:
    name: Sella TS optimizer (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Sella optional extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[xtb,sella]" --group test

      - name: Exercise Sella TS optimization with the optional extra
        run: python -m pytest tests/test_neb.py -q

      - name: Check NEB CLI help without loading Sella
        run: pyar-neb --help

  installation:
    needs: archives
    name: User installation (${{ matrix.mode }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [core, aggregate, conformer, reaction, aimnet2, neb, ml, analysis, microsolvate]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install as an end user
        shell: bash
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(realpath dist/*.whl)
          case "${{ matrix.mode }}" in
            core) python -m pip install "$WHEEL" ;;
            ml) python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; python -m pip install "$WHEEL[ml]" ;;
            aimnet2) python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; python -m pip install "$WHEEL[conformer,aimnet2]" ;;
            *) python -m pip install "$WHEEL[${{ matrix.mode }}]" ;;
          esac
          python -m pip check
      - name: Exercise installed package outside checkout
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/tools/installation_smoke.py" "${{ matrix.mode }}"

  archives:
    name: Clean wheel and sdist installations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip --group release
      - run: python -m build
      - name: Inspect archives
        run: |
          python tools/check_distributions.py dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install wheel into clean environment
        run: |
          WHEEL=$(realpath dist/*.whl)
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/python -m pip check
          cd /tmp
          /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/tools/installation_smoke.py" core
          /tmp/wheel-env/bin/python -m pip install "$WHEEL[aggregate]"
          /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/tools/installation_smoke.py" aggregate
          /tmp/wheel-env/bin/python -m pip install "$WHEEL[reaction]"
          /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/tools/installation_smoke.py" reaction
          /tmp/wheel-env/bin/python -m pip check
      - name: Install sdist into clean environment
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-env/bin/python -m pip check
          cd /tmp
          /tmp/sdist-env/bin/python "$GITHUB_WORKSPACE/tools/installation_smoke.py" core

  quality:
    name: Lint, format and fast regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install Open Babel for regression preflights
        run: |
          sudo apt-get update
          sudo apt-get install --yes openbabel
          obabel -V
      - run: python -m pip install -e ".[selection,xtb]" --group test --group quality
      - run: python -m ruff check tests tools
      - run: python -m ruff format --check tools/check_documentation.py tools/check_test_outcomes.py tools/release_evidence.py tools/release_promotion.py tools/scientific_validation.py tools/verify_pypi_release.py tests/conftest.py tests/test_documentation_contract.py tests/test_release_evidence.py tests/test_release_promotion.py tests/test_scientific_validation.py
      - name: Generate source-bound complexity report
        run: python tools/measure_complexity.py --output-dir reports/complexity
      - run: python tools/check_documentation.py
      - name: Run deterministic scientific Tier 1 tests
        run: python -m pytest -m "scientific and tier1" --junitxml=reports/scientific-tier1.xml
      - run: python -m pytest -m "(unit or regression) and not slow and not external_backend" --junitxml=reports/fast.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-regressions
          path: reports/

  required:
    name: R1 required checks
    if: always()
    needs: [test, docs, geodesic, sella, installation, archives, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Validate candidate and all required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > results.json
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python tools/release_evidence.py dist --sha "$GITHUB_SHA" --version "$VERSION" --results results.json --required test docs geodesic sella installation archives quality --output r1-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1-evidence
          path: r1-evidence.json
